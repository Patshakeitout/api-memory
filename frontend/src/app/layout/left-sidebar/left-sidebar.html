<nav class="sidenav" [ngClass]="isLeftSidebarCollapsed() ? 'sidenav--collapsed' : ''">
  <header class="sidenav__header">
    <button class="sidenav__logo" (click)="toggleCollapse()" aria-label="toggle menu">
      <i class="fal fa-bars" aria-hidden="true"></i>
    </button>
    @if (!isLeftSidebarCollapsed()) {
      <span class="sidenav__brand">API-Memory</span>
      <button class="sidenav__close" (click)="closeSideNav()" aria-label="close menu">
        <i class="fal fa-times" aria-hidden="true"></i>
      </button>
    }
  </header>

  <ul class="sidenav__nav">
    @for (item of items; track $index) {
      <li class="sidenav__item">
        <a
          class="sidenav__link"
          [routerLink]="item.routeLink"
          routerLinkActive="sidenav__link--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="sidenav__icon" [class]="item.icon" aria-hidden="true"></i>
          @if (!isLeftSidebarCollapsed()) {
            <span class="sidenav__text">{{ item.label }}</span>
          }
        </a>
      </li>
    }
  </ul>
</nav>
